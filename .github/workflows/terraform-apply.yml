name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=scalecommerce/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -input=false
        working-directory: terraform

      - name: Terraform Plan
        run: |
          terraform plan -out=tfplan -input=false \
            -var="environment=dev" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="account_id=${{ secrets.AWS_ACCOUNT_ID }}" \
            -var="key_pair_name=${{ secrets.KEY_PAIR_NAME }}" \
            -var="ami_id=${{ secrets.AMI_ID }}"
        working-directory: terraform

      - name: Terraform Apply
        run: terraform apply -input=false tfplan
        working-directory: terraform

      - name: Capture Outputs
        id: outputs
        run: |
          echo "alb_dns=$(terraform output -raw external_alb_dns_name)" >> $GITHUB_OUTPUT
          echo "cf_domain=$(terraform output -raw cloudfront_domain_name)" >> $GITHUB_OUTPUT
        working-directory: terraform

      - name: Deployment Summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ALB DNS | ${{ steps.outputs.outputs.alb_dns }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CloudFront | ${{ steps.outputs.outputs.cf_domain }} |" >> $GITHUB_STEP_SUMMARY
